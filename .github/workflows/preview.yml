# Per-PR Cloudflare Worker Preview: `wrangler preview` on every push, `wrangler preview delete` on close.
# Previews use the `previews` block in wrangler.jsonc (own KV namespace) and never touch production.
# https://developers.cloudflare.com/workers/previews/
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per PR: a new push cancels the in-flight Preview, and closing cancels it before cleanup.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Worker Preview
    # Fork and Dependabot PRs get no repository secrets, so skip them instead of failing.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `wrangler preview` bundles the Worker itself but uploads assets from dist/, which must exist.
      - name: Build
        run: bun run build

      # No wranglerVersion: the action uses the Wrangler version pinned in bun.lock.
      # No gitHubToken: with it the action creates a GitHub Deployment whose environment is the Preview
      # name, leaving one `pr-<number>` environment per PR in the repo. The PR comment below is enough.
      - name: Deploy Preview
        id: preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: preview --name pr-${{ github.event.pull_request.number }}

      - name: Comment Preview URL
        if: steps.preview.outputs.preview-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.preview-deployment-url }}
        run: |
          body="$(cat <<EOF
          ### Worker Preview

          | | |
          | --- | --- |
          | Latest | $PREVIEW_URL |
          | This commit (\`${HEAD_SHA:0:7}\`) | ${DEPLOYMENT_URL:-n/a} |

          Updates on every push and is deleted when this PR closes. Uses the Preview KV namespace, not production.
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"

  cleanup:
    name: Delete Worker Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # No checkout: --worker-name replaces wrangler.jsonc. Keep the version in step with bun.lock.
      # PRs opened before this workflow existed have no Preview, so a failed delete doesn't fail the run.
      - name: Delete Preview
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.165.0 preview delete
          --name "pr-${PR_NUMBER}"
          --worker-name atlasos-website
          --skip-confirmation
