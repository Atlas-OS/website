name: CI

on:
  pull_request:
  workflow_dispatch:
  # Called by deploy-workers.yml so production deploys reuse this exact validation and build.
  workflow_call:
    inputs:
      upload-dist:
        description: Upload the built dist/ directory as an artifact for a later deploy job.
        type: boolean
        default: false
    outputs:
      dist-artifact:
        description: Name of the uploaded dist/ artifact. Empty unless upload-dist is true.
        value: ${{ jobs.validate.outputs.dist-artifact }}

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIST_ARTIFACT: dist
    outputs:
      dist-artifact: ${{ steps.upload-dist.outputs.artifact-id && env.DIST_ARTIFACT || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate Cloudflare Worker bundle
        run: bun run deploy:dry-run

      - name: Upload dist
        id: upload-dist
        if: inputs.upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.DIST_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          # Deploy the build exactly as produced, including any dotfiles (e.g. .well-known/, .assetsignore).
          include-hidden-files: true
          retention-days: 1
